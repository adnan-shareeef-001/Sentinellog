[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinellog"
version = "0.1.0"
description = "A Python-based log analysis and threat detection CLI platform mimicking SOC analyst workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
evtx = [
    "python-evtx>=0.7.4",
]
dashboard = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
]
geoip = [
    "geoip2>=4.8.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
sentinellog = "sentinellog.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"src/sentinellog/cli.py" = ["B008"]
"src/sentinellog/output/html_report.py" = ["E501"]
"src/sentinellog/simulate/*" = ["S311"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sentinellog --cov-fail-under=80"
pythonpath = ["src"]
